<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: auto;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        form {
            margin-bottom: 20px;
        }

        input,
        button {
            margin: 5px;
            padding: 10px;
        }

        #certificates {
            margin-top: 20px;
        }

        #my-certificates {
            margin-top: 20px;
            flex-direction: column;
            align-items: center;
            height: 150px;
            overflow-y: auto;
            background-color: #eee;
            padding: 20px;
        }

        .certificate {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 5px;
            max-width: 500px;
            width: 90%;
            margin: auto;
        }

        /* all .certificates except last */
        .certificate:not(:last-child) {
            border-bottom: 1px solid #ccc;
        }

        .certificate button {
            margin-left: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 80%;
            max-height: 80%;
            overflow: auto;
        }

        .modal iframe {
            width: 100%;
            height: 500px;
            border: none;
        }

        .modal-close {
            margin-top: 10px;
            padding: 10px;
            background: #f44336;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1 style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 20px;">
        Certificate Manager
        <button id="logoutButton" style="margin-left: auto;">Logout</button>
    </h1>

    <div id="auth">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="identifier" placeholder="Email or Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <h2>Register</h2>
        <form id="registerForm">
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="text" id="regUsername" placeholder="Username" required>
            <input type="password" id="regPassword" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
    </div>

    <div id="app" style="display: none;">
        <h2>Upload Certificates</h2>
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="certificates" multiple required>
            <button type="submit">Upload</button>
        </form>

        <h2>Your Certificates</h2>
        <div id="my-certificates"></div>

        <div id="modal" class="modal">
            <div class="modal-content">
                <iframe id="pdfViewer" src=""></iframe>
                <button class="modal-close" onclick="closeModal()">Close</button>
            </div>
        </div>

        <script>
            const apiUrl = 'http://localhost:3000';

            // Helper function to set token
            function setToken(token) {
                localStorage.setItem('token', token);
            }

            // Helper function to get token
            function getToken() {
                return localStorage.getItem('token');
            }

            // Show or hide sections based on login status
            function updateUI() {
                const token = getToken();
                document.getElementById('auth').style.display = token ? 'none' : 'block';
                document.getElementById('app').style.display = token ? 'block' : 'none';
            }

            // Login form submission
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const identifier = document.getElementById('identifier').value;
                const password = document.getElementById('password').value;

                const response = await fetch(`${apiUrl}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    setToken(data.token);
                    updateUI();
                    alert('Login successful!');
                } else {
                    alert('Login failed!');
                }
                loadCertificates();
            });

            // Register form submission
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('regEmail').value;
                const username = document.getElementById('regUsername').value;
                const password = document.getElementById('regPassword').value;

                const response = await fetch(`${apiUrl}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, username, password })
                });

                if (response.ok) {
                    alert('Registration successful!');
                } else {
                    alert('Registration failed!');
                }
            });

            // Upload form submission
            document.getElementById('uploadForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fileInput = document.getElementById('certificates');
                const formData = new FormData();
                Array.from(fileInput.files).forEach(file => {
                    formData.append('certificates', file);
                });

                const response = await fetch(`${apiUrl}/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    alert(`Certificates uploaded!`);
                    loadCertificates();
                } else {
                    alert('Upload failed!');
                }
            });

            function openModal(pdfUrl) {
                const modal = document.getElementById('modal');
                const pdfViewer = document.getElementById('pdfViewer');
                pdfViewer.src = pdfUrl;
                modal.style.display = 'flex';
            }

            function closeModal() {
                const modal = document.getElementById('modal');
                modal.style.display = 'none';
                const pdfViewer = document.getElementById('pdfViewer');
                pdfViewer.src = '';
            }

            async function loadCertificates() {
                const response = await fetch(`${apiUrl}/certificates`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });

                const container = document.getElementById('my-certificates');
                container.innerHTML = ''; // Clear previous content

                if (response.ok) {
                    const certificates = await response.json();

                    if (certificates.length === 0) {
                        container.textContent = 'No certificates found.';
                    } else {
                        certificates.forEach(cert => {
                            const certDiv = document.createElement('div');
                            certDiv.className = 'certificate';
                            certDiv.style.display = 'flex';
                            certDiv.style.alignItems = 'center';
                            certDiv.style.marginBottom = '10px';

                            const serialText = document.createElement('span');
                            serialText.textContent = cert.serial;
                            serialText.style.marginRight = '10px';

                            const buttonGroup = document.createElement('div');
                            buttonGroup.style.display = 'flex';
                            buttonGroup.style.gap = '5px';

                            const viewText = document.createElement('span');
                            viewText.textContent = '[view]';
                            viewText.style.cursor = 'pointer';
                            viewText.style.color = '#555'; // Minimalist color
                            viewText.style.textDecoration = 'none';
                            viewText.addEventListener('mouseover', () => viewText.style.textDecoration = 'underline');
                            viewText.addEventListener('mouseout', () => viewText.style.textDecoration = 'none');
                            viewText.addEventListener('click', async () => {
                                const response = await fetch(`${apiUrl}/retrieve?serial=${cert.serial}`, {
                                    method: 'GET',
                                    headers: { 'Authorization': `Bearer ${getToken()}` }
                                });

                                if (response.ok) {
                                    const blob = await response.blob();
                                    const url = URL.createObjectURL(blob);
                                    openModal(url);
                                } else {
                                    alert('Failed to load certificate!');
                                }
                            });

                            const deleteText = document.createElement('span');
                            deleteText.textContent = '[delete]';
                            deleteText.style.cursor = 'pointer';
                            deleteText.style.color = '#555'; // Minimalist color
                            deleteText.style.textDecoration = 'none';
                            deleteText.addEventListener('mouseover', () => deleteText.style.textDecoration = 'underline');
                            deleteText.addEventListener('mouseout', () => deleteText.style.textDecoration = 'none');
                            deleteText.addEventListener('click', async () => {
                                const confirmed = confirm('Are you sure you want to delete this certificate?');
                                if (confirmed) {
                                    const deleteResponse = await fetch(`${apiUrl}/delete?serial=${cert.serial}`, {
                                        method: 'DELETE',
                                        headers: { 'Authorization': `Bearer ${getToken()}` }
                                    });

                                    if (deleteResponse.ok) {
                                        alert('Certificate deleted successfully!');
                                        loadCertificates();
                                    } else {
                                        alert('Failed to delete certificate!');
                                    }
                                }
                            });

                            buttonGroup.appendChild(viewText);
                            buttonGroup.appendChild(deleteText);
                            certDiv.appendChild(serialText);
                            certDiv.appendChild(buttonGroup);
                            container.appendChild(certDiv);
                        });
                    }
                } else {
                    container.textContent = 'Failed to load certificates!';
                }
            }

            // Logout functionality
            document.getElementById('logoutButton').addEventListener('click', () => {
                localStorage.removeItem('token');
                updateUI();
                alert('Logged out successfully!');
            });

            // Initialize UI
            updateUI();
            if (getToken()) loadCertificates();
        </script>
    </div>
</body>

</html>
